---
layout: default
---

<!-- Hero interno de la página -->
<section class="page-hero">
  <div class="page-hero-contenido">
    <h1 class="page-titulo">{{ page.title }}</h1>
    <div class="page-linea-decorativa"></div>
  </div>
</section>

<!-- Contenido principal con máximo ancho para legibilidad -->
<article class="page-contenido">
  <div class="page-wrapper">
    {{ content }}
  </div>
</article>

<!-- Script para animar entrada de elementos al scroll -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Agregar clase de animación a elementos con class "animar-entrada"
    const elementos = document.querySelectorAll('h2, .animar-entrada');

    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target); // Solo animar una vez
        }
      });
    }, {
      threshold: 0.1
    });

    elementos.forEach(function(elemento) {
      elemento.classList.add('animar-entrada');
      observer.observe(elemento);
    });
  });
</script>
