---
layout: default
---

<!-- Hero interno de la página -->
<section class="page-hero">
  <div class="page-hero-contenido">
    <h1 class="page-titulo">{{ page.title }}</h1>
    <div class="page-linea-decorativa"></div>
  </div>
</section>

<!-- Contenido principal con máximo ancho para legibilidad -->
<article class="page-contenido">
  <div class="page-wrapper animar-entrada">
    {{ content }}
  </div>
</article>

<!-- Nota: La animación de entrada (Intersection Observer) se gestiona
     centralmente en assets/js/main.js (FASE 4). -->
